<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="aGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Outline -->
  <path d="M256 32L80 112V240C80 355.2 154.8 459.4 256 496C357.2 459.4 432 355.2 432 240V112L256 32Z" 
        fill="#0B1120" stroke="url(#shieldGrad)" stroke-width="16" filter="url(#glow)" />

  <!-- Inner Cyber Lines -->
  <path d="M256 64L112 128V232C112 328 174 416 256 448C338 416 400 328 400 232V128L256 64Z" 
        fill="none" stroke="#00E5FF" stroke-opacity="0.3" stroke-width="4" stroke-dasharray="12 6" />

  <!-- Stylized Letter A inside Shield -->
  <path d="M256 120L160 360H210L234 300H278L302 360H352L256 120ZM256 220L268 260H244L256 220Z" 
        fill="url(#aGrad)" />

  <!-- Central Cyber Core Dot -->
  <circle cx="256" cy="240" r="10" fill="#00E5FF" filter="url(#glow)" />
</svg>
